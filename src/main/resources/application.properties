spring.application.name=sistema-almacen-srh
server.port=8080

# Conexión a MySQL (cambia la contraseña por la de tu usuario root)
spring.datasource.url=jdbc:mysql://localhost:3306/bd_almacen_srh?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate: las tablas se crean con el script SQL; Hibernate solo valida que coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
