<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sede')}"></head>
<body>
<header th:replace="~{fragments/layout :: menu}"></header>
<main class="contenido">
    <h2 th:text="${sede.idSede == null} ? 'Nueva sede' : 'Editar sede'"></h2>
    <div th:replace="~{fragments/layout :: mensajes}"></div>
    <form th:action="@{/sedes/guardar}" th:object="${sede}" method="post" class="formulario">
        <input type="hidden" th:field="*{idSede}">
        <label>Nombre
            <input type="text" th:field="*{nombre}" placeholder="Ej.: Hospital Barton" required maxlength="80">
            <small class="error" th:errors="*{nombre}"></small>
        </label>
        <label>Tipo
            <select th:field="*{tipo}" required>
                <option value="">-- Seleccione --</option>
                <option value="PLANTA">Planta</option>
                <option value="HOSPITAL">Hospital</option>
            </select>
            <small class="error" th:errors="*{tipo}"></small>
        </label>
        <label class="casilla"><input type="checkbox" th:field="*{activo}"> Sede activa</label>
        <div class="botones">
            <button type="submit" class="btn">Guardar</button>
            <a th:href="@{/sedes}" class="btn gris">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
