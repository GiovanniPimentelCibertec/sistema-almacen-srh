<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sedes')}"></head>
<body>
<header th:replace="~{fragments/layout :: menu}"></header>
<main class="contenido">
    <div class="titulo"><h2>Sedes</h2>
        <a th:href="@{/sedes/nuevo}" class="btn">+ Nueva sede</a></div>
    <div th:replace="~{fragments/layout :: mensajes}"></div>
    <table>
        <thead><tr><th>#</th><th>Sede</th><th>Tipo</th><th>Control de stock desde</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(sedes)}"><td colspan="6">No hay sedes registradas.</td></tr>
        <tr th:each="sede : ${sedes}" th:classappend="${!sede.activo} ? 'inactivo'">
            <td th:text="${sede.idSede}"></td>
            <td th:text="${sede.nombre}"></td>
            <td th:text="${sede.tipo == 'HOSPITAL'} ? 'Hospital' : 'Planta'"></td>
            <td th:text="${sede.fechaInicioControl != null} ? ${#temporals.format(sede.fechaInicioControl, 'dd/MM/yyyy')} : '-'"></td>
            <td><span class="estado" th:classappend="${sede.activo} ? 'on' : 'off'" th:text="${sede.activo} ? 'Activa' : 'Inactiva'"></span></td>
            <td class="acciones">
                <a th:href="@{/sedes/editar/{id}(id=${sede.idSede})}" class="btn-sm">Editar</a>
                <form th:action="@{/sedes/estado/{id}(id=${sede.idSede})}" method="post">
                    <button class="btn-sm gris" th:text="${sede.activo} ? 'Desactivar' : 'Activar'"></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="nota">Las sedes no se borran porque tienen movimientos: se desactivan. Un hospital nuevo empieza con stock 0.</p>
</main>
</body>
</html>
