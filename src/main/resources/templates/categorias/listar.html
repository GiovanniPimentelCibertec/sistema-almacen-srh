<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Gestión de Categorías')}"></head>
<body>

    <div th:replace="~{fragments/layout :: menu}"></div>
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <main class="container" style="padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Listado de Categorías</h2>
            <a th:href="@{/categorias/nuevo}" style="padding: 8px 15px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px;">+ Nueva Categoría</a>
        </div>

        <table border="1" style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
                <tr style="background-color: #f2f2f2;">
                    <th style="padding: 10px;">ID</th>
                    <th style="padding: 10px;">Nombre de Categoría</th>
                    <th style="padding: 10px; text-align: center;">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cat : ${categorias}">
                    <td style="padding: 10px;" th:text="${cat.idCategoria}">1</td>
                    <td style="padding: 10px;" th:text="${cat.nombre}">Nombre</td>
                    <td style="padding: 10px; text-align: center;">
                        <a th:href="@{/categorias/editar/{id}(id=${cat.idCategoria})}" style="color: blue; margin-right: 10px;">Editar</a>
                        <a th:href="@{/categorias/eliminar/{id}(id=${cat.idCategoria})}" style="color: red;" onclick="return confirm('¿Está seguro de eliminar esta categoría?');">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(categorias)}">
                    <td colspan="3" style="padding: 20px; text-align: center; color: gray;">No hay categorías registradas.</td>
                </tr>
            </tbody>
        </table>
    </main>

</body>
</html>
