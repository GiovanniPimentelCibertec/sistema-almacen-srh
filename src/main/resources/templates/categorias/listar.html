<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorías')}"></head>
<body>
<header th:replace="~{fragments/layout :: menu}"></header>
<main class="contenido">
    <div class="titulo"><h2>Categorías</h2>
        <a th:href="@{/categorias/nuevo}" class="btn">+ Nueva categoría</a></div>
    <div th:replace="~{fragments/layout :: mensajes}"></div>
    <table class="angosta">
        <thead><tr><th>#</th><th>Categoría</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(categorias)}"><td colspan="3">No hay categorías registradas.</td></tr>
        <tr th:each="cat : ${categorias}">
            <td th:text="${cat.idCategoria}"></td>
            <td th:text="${cat.nombre}"></td>
            <td class="acciones">
                <a th:href="@{/categorias/editar/{id}(id=${cat.idCategoria})}" class="btn-sm">Editar</a>
                <!-- Solo se elimina si ningún producto la usa; va por POST para que lo proteja el token CSRF -->
                <form th:action="@{/categorias/eliminar/{id}(id=${cat.idCategoria})}" method="post"
                      onsubmit="return confirm('¿Eliminar esta categoría?');">
                    <button class="btn-sm gris">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="nota">Una categoría solo se puede eliminar si ningún producto la usa.</p>
</main>
</body>
</html>
