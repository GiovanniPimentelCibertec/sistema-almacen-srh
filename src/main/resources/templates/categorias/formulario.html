<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categoría')}"></head>
<body>
<header th:replace="~{fragments/layout :: menu}"></header>
<main class="contenido">
    <h2 th:text="${categoria.idCategoria == null} ? 'Nueva categoría' : 'Editar categoría'"></h2>
    <div th:replace="~{fragments/layout :: mensajes}"></div>
    <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post" class="formulario">
        <input type="hidden" th:field="*{idCategoria}">
        <label>Nombre
            <input type="text" th:field="*{nombre}" placeholder="Ej.: EPP, Bolsas, Químicos" required maxlength="80">
            <small class="error" th:errors="*{nombre}"></small>
        </label>
        <div class="botones">
            <button type="submit" class="btn">Guardar</button>
            <a th:href="@{/categorias}" class="btn gris">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
