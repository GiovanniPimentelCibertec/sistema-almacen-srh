<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Producto')}"></head>
<body>
<header th:replace="~{fragments/layout :: menu}"></header>
<main class="contenido">
    <h2 th:text="${producto.idProducto != null} ? 'Editar producto' : 'Nuevo producto'"></h2>
    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" class="formulario dos">
        <input type="hidden" th:field="*{idProducto}">
        <label>Código
            <input type="text" th:field="*{codigo}" placeholder="BOL-001" th:readonly="${producto.idProducto != null}">
            <small class="error" th:errors="*{codigo}"></small>
        </label>
        <label>Nombre
            <input type="text" th:field="*{nombre}">
            <small class="error" th:errors="*{nombre}"></small>
        </label>
        <label>Categoría
            <select name="categoria">
                <option value="">-- Seleccione --</option>
                <option th:each="c : ${categorias}" th:value="${c.idCategoria}" th:text="${c.nombre}"
                        th:selected="${producto.categoria != null and producto.categoria.idCategoria == c.idCategoria}"></option>
            </select>
            <small class="error" th:errors="*{categoria}"></small>
        </label>
        <label>Marca
            <select name="marca">
                <option value="">-- Seleccione --</option>
                <option th:each="m : ${marcas}" th:value="${m.idMarca}" th:text="${m.nombre}"
                        th:selected="${producto.marca != null and producto.marca.idMarca == m.idMarca}"></option>
            </select>
            <small class="error" th:errors="*{marca}"></small>
        </label>
        <label>Unidad
            <input type="text" th:field="*{unidad}" placeholder="UND, PAR, CAJA, GALÓN...">
            <small class="error" th:errors="*{unidad}"></small>
        </label>
        <label>Días de reposición
            <input type="number" th:field="*{diasReposicion}" min="1">
            <small class="error" th:errors="*{diasReposicion}"></small>
        </label>
        <label>Mínimo inicial
            <input type="number" th:field="*{minimoInicial}" min="0">
            <small class="error" th:errors="*{minimoInicial}"></small>
        </label>
        <label>Stock actual
            <input type="text" th:value="${producto.stock} ?: 0" disabled>
            <em>Solo cambia con entradas, salidas y ajustes</em>
        </label>
        <div class="botones">
            <button type="submit" class="btn">Guardar</button>
            <a th:href="@{/productos/listar}" class="btn gris">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
