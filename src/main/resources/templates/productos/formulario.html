<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2 th:text="${producto.idProducto != null} ? 'Editar Producto' : 'Nuevo Producto'">Registrar Producto</h2>
    
    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" class="mt-3">
        <input type="hidden" th:field="*{idProducto}">
        
        <div class="mb-3">
            <label class="form-label">Código:</label>
            <input type="text" th:field="*{codigo}" class="form-control" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Nombre del Producto:</label>
            <input type="text" th:field="*{nombre}" class="form-control" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Unidad de Medida (ej. Und, Kg):</label>
            <input type="text" th:field="*{unidad}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Stock Inicial:</label>
            <input type="number" th:field="*{stock}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Stock Mínimo:</label>
            <input type="number" th:field="*{stockMinimo}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Días de Reposición:</label>
            <input type="number" th:field="*{diasReposicion}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Mínimo Inicial:</label>
            <input type="number" th:field="*{minimoInicial}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Categoría:</label>
            <select th:field="*{categoria.idCategoria}" class="form-control" required>
                <option value="">-- Seleccione Categoría --</option>
                <option th:each="cat : ${categorias}" th:value="${cat.idCategoria}" th:text="${cat.nombre}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Marca:</label>
            <select th:field="*{marca.idMarca}" class="form-control" required>
                <option value="">-- Seleccione Marca --</option>
                <option th:each="mar : ${marcas}" th:value="${mar.idMarca}" th:text="${mar.nombre}"></option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-success">Guardar</button>
        <a th:href="@{/productos/listar}" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
