<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Productos')}"></head>
<body>
<header th:replace="~{fragments/layout :: menu}"></header>
<main class="contenido">
    <div class="titulo"><h2>Productos</h2>
        <a sec:authorize="hasRole('JEFE')" th:href="@{/productos/nuevo}" class="btn">+ Nuevo producto</a></div>
    <div th:replace="~{fragments/layout :: mensajes}"></div>
    <table>
        <thead><tr><th>Código</th><th>Producto</th><th>Categoría</th><th>Marca</th><th>Unidad</th>
            <th>Stock</th><th>Mínimo</th><th>Situación</th><th sec:authorize="hasRole('JEFE')">Acciones</th></tr></thead>
        <tbody>
        <tr th:each="p : ${productos}" th:classappend="${!p.activo} ? 'inactivo'">
            <td th:text="${p.codigo}"></td>
            <td th:text="${p.nombre}"></td>
            <td th:text="${p.categoria.nombre}"></td>
            <td th:text="${p.marca.nombre}"></td>
            <td th:text="${p.unidad}"></td>
            <td class="num" th:text="${p.stock}"></td>
            <td class="num" th:text="${p.stockMinimo}"></td>
            <td><span class="estado" th:classappend="${p.stock <= p.stockMinimo} ? 'off' : 'on'"
                      th:text="${p.stock <= p.stockMinimo} ? 'Reponer' : 'OK'"></span></td>
            <td class="acciones" sec:authorize="hasRole('JEFE')">
                <a th:href="@{/productos/editar/{id}(id=${p.idProducto})}" class="btn-sm">Editar</a>
                <form th:action="@{/productos/estado/{id}(id=${p.idProducto})}" method="post">
                    <button class="btn-sm gris" th:text="${p.activo} ? 'Desactivar' : 'Activar'"></button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <p class="nota">El stock solo cambia con entradas, salidas y ajustes. El mínimo se calcula con el consumo de los últimos 90 días.</p>
</main>
</body>
</html>
