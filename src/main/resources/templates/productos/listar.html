<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2>Listado de Productos</h2>
    <a th:href="@{/productos/nuevo}" class="btn btn-primary mb-3">Nuevo Producto</a>
    
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Código</th>
                <th>Nombre</th>
                <th>Unidad</th>
                <th>Stock</th>
                <th>Categoría</th>
                <th>Marca</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(productos)}">
                <td colspan="8" class="text-center">No hay productos registrados.</td>
            </tr>
            <tr th:each="p : ${productos}">
                <td th:text="${p.idProducto}">1</td>
                <td th:text="${p.codigo}">P001</td>
                <td th:text="${p.nombre}">Laptop Lenovo</td>
                <td th:text="${p.unidad}">Und</td>
                <td th:text="${p.stock}">10</td>
                <td th:text="${p.categoria != null ? p.categoria.nombre : 'N/A'}">Cat</td>
                <td th:text="${p.marca != null ? p.marca.nombre : 'N/A'}">Marca</td>
                <td>
                    <a th:href="@{/productos/editar/{id}(id=${p.idProducto})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/productos/eliminar/{id}(id=${p.idProducto})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro de eliminar este producto?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
    <a th:href="@{/}" class="btn btn-secondary">Volver al Inicio</a>
</body>
</html>
