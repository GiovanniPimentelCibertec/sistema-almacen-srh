<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Marcas')}"></head>
<body>
<header th:replace="~{fragments/layout :: menu}"></header>
<main class="contenido">
    <h2 th:text="${marca.idMarca == null} ? 'Nueva marca' : 'Editar marca'"></h2>
    <form th:action="@{/marcas/guardar}" th:object="${marca}" method="post" class="formulario">
        <input type="hidden" th:field="*{idMarca}">
        <label>Nombre
            <input type="text" th:field="*{nombre}">
            <small class="error" th:errors="*{nombre}"></small>
        </label>
        <div class="botones">
            <button type="submit" class="btn">Guardar</button>
            <a th:href="@{/marcas}" class="btn gris">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
