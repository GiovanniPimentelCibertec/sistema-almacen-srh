<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Marcas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2>Listado de Marcas</h2>
    <a th:href="@{/marcas/nuevo}" class="btn btn-primary mb-3">Nueva Marca</a>
    
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(marcas)}">
                <td colspan="3" class="text-center">No hay marcas registradas.</td>
            </tr>
            <tr th:each="m : ${marcas}">
                <td th:text="${m.idMarca}">1</td>
                <td th:text="${m.nombre}">Nike</td>
                <td>
                    <a th:href="@{/marcas/editar/{id}(id=${m.idMarca})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/marcas/eliminar/{id}(id=${m.idMarca})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Estás seguro de eliminar esta marca?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
    <a th:href="@{/}" class="btn btn-secondary">Volver al Inicio</a>
</body>
</html>
