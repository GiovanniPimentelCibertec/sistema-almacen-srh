<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Marcas')}"></head>
<body>
<header th:replace="~{fragments/layout :: menu}"></header>
<main class="contenido">
    <div class="titulo"><h2>Marcas</h2><a th:href="@{/marcas/nuevo}" class="btn">+ Nueva marca</a></div>
    <div th:replace="~{fragments/layout :: mensajes}"></div>
    <table class="angosta">
        <thead><tr><th>#</th><th>Nombre</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(marcas)}"><td colspan="3">No hay marcas registradas.</td></tr>
        <tr th:each="m : ${marcas}">
            <td th:text="${m.idMarca}"></td>
            <td th:text="${m.nombre}"></td>
            <td class="acciones">
                <a th:href="@{/marcas/editar/{id}(id=${m.idMarca})}" class="btn-sm">Editar</a>
                <form th:action="@{/marcas/eliminar/{id}(id=${m.idMarca})}" method="post"
                      onsubmit="return confirm('¿Seguro que desea eliminar esta marca?')">
                    <button class="btn-sm gris">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
