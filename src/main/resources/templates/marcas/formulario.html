<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Marca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2 th:text="${marca.idMarca != null} ? 'Editar Marca' : 'Nueva Marca'">Registrar Marca</h2>
    
    <form th:action="@{/marcas/guardar}" th:object="${marca}" method="post" class="mt-3">
        <input type="hidden" th:field="*{idMarca}">
        
        <div class="mb-3">
            <label class="form-label">Nombre de la Marca:</label>
            <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ingrese nombre de marca" required>
            <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>
        
        <button type="submit" class="btn btn-success">Guardar</button>
        <a th:href="@{/marcas/listar}" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
