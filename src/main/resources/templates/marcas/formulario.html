<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Marca')}"></head>
<body>
<header th:replace="~{fragments/layout :: menu}"></header>
<main class="contenido">
    <h2 th:text="${marca.idMarca != null} ? 'Editar marca' : 'Nueva marca'"></h2>
    <div th:replace="~{fragments/layout :: mensajes}"></div>
    <form th:action="@{/marcas/guardar}" th:object="${marca}" method="post" class="formulario">
        <input type="hidden" th:field="*{idMarca}">
        <label>Nombre de la marca
            <input type="text" th:field="*{nombre}" placeholder="Ingrese nombre de marca">
            <small class="error" th:errors="*{nombre}"></small>
        </label>
        <div class="botones">
            <button type="submit" class="btn">Guardar</button>
            <a th:href="@{/marcas/listar}" class="btn gris">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
